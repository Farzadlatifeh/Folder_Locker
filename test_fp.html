<!DOCTYPE html>
<html>
<head>
    <title>Test Forgot Password</title>
    <style>
        body { background: #1e1e2f; color: #eee; font-family: sans-serif; padding: 20px; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
        .row { margin: 10px 0; }
        .hidden { display: none; }
        #log { background: #2a2a3c; padding: 10px; margin-top: 20px; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>🔑 Test Forgot Password Flow</h2>
    
    <div>
        <input type="text" id="fpUsername" placeholder="Enter username (testuser)">
    </div>
    
    <div id="questionsContainer">
        <div class="row hidden" id="fpQ1Row"><p id="fpQuestion1"></p></div>
        <div class="row hidden" id="fpA1Row"><input type="text" id="fpAnswer1" placeholder="Answer 1"></div>
        
        <div class="row hidden" id="fpQ2Row"><p id="fpQuestion2"></p></div>
        <div class="row hidden" id="fpA2Row"><input type="text" id="fpAnswer2" placeholder="Answer 2"></div>
        
        <div class="row hidden" id="fpQ3Row"><p id="fpQuestion3"></p></div>
        <div class="row hidden" id="fpA3Row"><input type="text" id="fpAnswer3" placeholder="Answer 3"></div>
    </div>
    
    <h3>Console Log:</h3>
    <div id="log"></div>
    
    <script>
        const API = 'http://localhost:5000/';
        const logDiv = document.getElementById('log');
        
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }
        
        async function loadUserSecurityQuestions(username) {
            try {
                log('Fetching questions for username: ' + username);
                const res = await fetch(API + 'forgot_password/questions', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username })
                });
                log('Response status: ' + res.status);
                const data = await res.json();
                log('Response data: ' + JSON.stringify(data));
                
                if (res.ok && data.success) {
                    const questions = data.questions;
                    log('Questions loaded: ' + JSON.stringify(questions));
                    
                    // Hide all question rows first
                    ['fpQ1Row', 'fpQ2Row', 'fpQ3Row', 'fpA1Row', 'fpA2Row', 'fpA3Row'].forEach(id => {
                        document.getElementById(id).classList.add('hidden');
                    });
                    
                    // Show only the questions this user has set
                    questions.forEach((q, index) => {
                        const qRow = document.getElementById(`fpQ${index + 1}Row`);
                        const aRow = document.getElementById(`fpA${index + 1}Row`);
                        const qText = document.getElementById(`fpQuestion${index + 1}`);
                        
                        log(`Setting question ${index + 1}: ${q}`);
                        qText.textContent = q;
                        qRow.classList.remove('hidden');
                        aRow.classList.remove('hidden');
                    });
                    
                    return true;
                } else {
                    log('No success or not OK: ' + JSON.stringify(data));
                    return false;
                }
            } catch (error) {
                log('Error: ' + error.message);
                return false;
            }
        }
        
        document.getElementById('fpUsername').addEventListener('input', function() {
            clearTimeout(this.debounceTimer);
            const username = this.value.trim().toLowerCase();
            log('Username input changed: ' + username);
            
            if (username.length >= 2) {
                this.debounceTimer = setTimeout(async () => {
                    log('Calling loadUserSecurityQuestions for: ' + username);
                    const loaded = await loadUserSecurityQuestions(username);
                    log('loadUserSecurityQuestions returned: ' + loaded);
                    if (!loaded) {
                        log('Hiding question rows because loaded=false');
                        ['fpQ1Row', 'fpQ2Row', 'fpQ3Row', 'fpA1Row', 'fpA2Row', 'fpA3Row'].forEach(id => {
                            document.getElementById(id).classList.add('hidden');
                        });
                    }
                }, 500);
            } else {
                log('Username too short, hiding questions');
                ['fpQ1Row', 'fpQ2Row', 'fpQ3Row', 'fpA1Row', 'fpA2Row', 'fpA3Row'].forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                });
            }
        });
        
        log('Page loaded. Start the Flask server and enter "testuser" in the username field.');
    </script>
</body>
</html>
